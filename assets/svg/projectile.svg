<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Proiettile -->
  <circle cx="50" cy="50" r="30" fill="#FFD43B" stroke="#F08C00" stroke-width="3"/>
  
  <!-- Effetto brillante -->
  <circle cx="40" cy="40" r="10" fill="#FFF" opacity="0.6"/>
  
  <!-- Scie di movimento -->
  <ellipse cx="20" cy="50" rx="15" ry="8" fill="#FFD43B" opacity="0.7"/>
  <ellipse cx="10" cy="50" rx="8" ry="5" fill="#FFD43B" opacity="0.5"/>
  
  <!-- Dettaglio centrale -->
  <circle cx="50" cy="50" r="15" fill="#FFF" opacity="0.3"/>
  <circle cx="50" cy="50" r="8" fill="#F08C00"/>
</svg>
